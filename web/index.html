<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>现在有空位吗</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="live" id="live" aria-hidden="true"></span>
    <div>
      <h1 id="room">自习室</h1>
      <p id="sub">实时座位</p>
    </div>
  </div>
  <div class="badge" id="mode">—</div>
</header>

<div class="alert hidden" id="alert" role="status"></div>

<section class="advice" id="advice">
  <div class="advice-main" id="adviceText">连接中…</div>
  <div class="advice-sub" id="adviceSub"></div>
</section>

<section class="stats" aria-label="座位统计">
  <div class="stat s-free"><b id="nFree">-</b><span>空闲</span></div>
  <div class="stat s-occ"><b id="nOcc">-</b><span>在用</span></div>
  <div class="stat s-away"><b id="nAway">-</b><span>暂离</span></div>
  <div class="stat s-unk"><b id="nUnk">-</b><span>未知</span></div>
</section>

<main>
  <div class="grid-head">
    <h2>座位</h2>
    <div class="legend">
      <i class="k free"></i>空
      <i class="k occ"></i>占用
      <i class="k away"></i>暂离
      <i class="k unk"></i>未知
    </div>
  </div>
  <div class="grid" id="grid" aria-live="polite"></div>
</main>

<section class="card">
  <h2>接下来几小时</h2>
  <div class="fc" id="fc"><span class="muted">加载中…</span></div>
</section>

<section class="card">
  <h2>最近一小时</h2>
  <canvas id="spark" height="90"></canvas>
  <p class="muted small" id="sparkNote">每个点代表当时有多少个空位</p>
</section>

<footer>
  <p><strong>关于隐私</strong></p>
  <p>本系统只统计"座位有没有人"，画面在设备本地处理，不上传、不保存、不识别任何人脸。
     如在现场看到摄像头，它只对着桌面和椅面。</p>
  <p class="muted small">发现不准？点任意座位帮我们纠错，这会直接改进识别。</p>
</footer>

<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-box">
    <h3 id="sheetTitle">A1</h3>
    <p class="muted small" id="sheetMeta"></p>
    <p class="small">这个座位现在实际情况是？</p>
    <div class="sheet-actions">
      <button class="btn" data-says="person">有人</button>
      <button class="btn" data-says="empty">没人</button>
    </div>
    <button class="btn ghost" id="sheetClose">关闭</button>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
