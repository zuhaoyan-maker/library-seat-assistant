name: selftest

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy

      - name: 跑 17 项自测（合成画面，不需要相机）
        run: python3 tools/test_detector.py

      - name: 检查所有模块能导入
        run: |
          python3 -c "import app.pipeline, app.server, app.detectors, app.state_machine, app.history, app.seatmap"
